<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07090f">
  <title>UNKNOWN — A signal from space</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="logo" href="#">U<span>.</span></a>
    <span class="status"><i></i> SIGNAL ACTIVE</span>
    <span class="coordinates">UNKNOWN / 001</span>
  </header>

  <main>
    <div class="headline">
      <p class="eyebrow">AN UNIDENTIFIED OBJECT</p>
      <h1>Somewhere<br>out <span>there.</span></h1>
    </div>

    <div class="sky" aria-label="A glowing UFO hovering in space">
      <div class="stars"></div>
      <div class="orbit orbit-a"></div>
      <div class="orbit orbit-b"></div>
      <div class="ufo">
        <div class="dome"><i></i></div>
        <div class="body">
          <div class="rim"></div>
          <div class="lights"><i></i><i></i><i></i><i></i><i></i></div>
        </div>
        <div class="bolt bolt-a"></div>
        <div class="bolt bolt-b"></div>
      </div>
      <div class="beam"></div>
      <div class="ground-glow"></div>
      <span class="star star-one">✳</span>
      <span class="star star-two">·</span>
      <span class="star star-three">+</span>
    </div>

    <div class="bottom">
      <p>WE ARE NOT ALONE.<br><span>OR MAYBE WE ARE.</span></p>
      <span class="scroll">SCROLL LESS. LOOK UP. ↗</span>
    </div>
  </main>

  <footer><span>© 2026 UNKNOWN</span><span>MADE OF COSMIC DUST</span></footer>
  <script src="script.js"></script>
</body>
</html>
